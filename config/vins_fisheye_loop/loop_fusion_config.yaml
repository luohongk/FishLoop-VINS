%YAML:1.0
---
#==========================================================

# 默认遵循原版 VINS-Fusion 的回环主流程：每个关键帧作为一个 DBoW 文档，
# 查询后只选择一个历史候选，使用“当前窗口 BRIEF -> 历史整帧稠密 BRIEF”
# 建立 3D-2D 对应，再进入几何验证和原版 pose graph 优化。鱼眼扩展仅负责
# 双相机 EUCM 规范视图、bearing 和相机外参。
loop_preserve_original_flow: 1
# VINS-Fisheye 的 loop_fusion / 位姿图回环配置。
#
# 默认链路对应原版 VINS-Fusion：
#   1. 双鱼眼图像展开为规范透视视图并提取稠密 FAST + BRIEF；
#   2. 每个关键帧的全部规范视图合并为一个 DBoW 文档；
#   3. DBoW 只返回一个历史关键帧进入几何验证；
#   4. 当前 VIO 窗口 BRIEF 匹配历史关键帧的稠密 BRIEF；
#   5. cam0/cam1 分别以 EUCM bearing 做 PnP，随后进入原版 pose graph。
#
# 因此不再依赖 cam0_pinhole_undist_full.yaml，也不订阅
# /vins_estimator/keyframe_image。
#==========================================================

#========================
# 基本输入/输出
#========================

# 是否按 VIO+IMU 的 4DoF 位姿图优化方式运行。
# 1 = 使用 IMU/VIO yaw 约束，只优化 x/y/z/yaw；0 = 不使用 IMU 分支。
imu: 1

# 原始双目鱼眼图像由 VINS 按输入时间戳重新发布。loop_fusion 用它们生成
# 2 cameras x 5 perspective views 的检索描述子，选出候选后回到原始 EUCM
# 像素/bearing 上做几何验证。
image0_topic: "/vins_estimator/fisheye/left/image_raw"
image1_topic: "/vins_estimator/fisheye/right/image_raw"

cam0_calib: "cam1_eucm.yaml"
cam1_calib: "cam2_eucm.yaml"
vio_config: "stereo_imu_config.yaml"

# 原始 EUCM 图像尺寸。
image_width: 1920
image_height: 1200

# 每台鱼眼生成 5 个规范针孔视图，两台相机共十个视图。
loop_view_size: 320
loop_view_fov_deg: 100.0
loop_view_features: 100

# 下列规范视图参数在 loop_retrieval_use_vio_features=0 时生效。
# view 0 是与 cam0 光轴一致的 identity/front 视图。
loop_retrieval_camera_count: 2
loop_retrieval_view_count: 5

# 与原版整图 BRIEF 对应：DBoW 使用规范视图上的稠密 FAST+BRIEF。
# 几何查询端仍然使用带 3D 点的当前 VIO window BRIEF。
loop_retrieval_use_vio_features: 0

# OpenCV central PnP 使用 x/z,y/z；EUCM 提升后 z 太小或为负的边缘 bearing
# 暂不进入 PnP。
loop_eucm_min_z: 0.10

# loop_fusion 结果输出目录。
# 程序会把回环优化后的轨迹写到 <output_path>/vio_loop.csv。
# 当前容器把本仓库挂载到 /root/catkin_ws/src/fishloop_vins。
# 写到这里会出现在宿主机 /home/lhk/workspace/FishLoop-VINS/data。
output_path: "/root/catkin_ws/src/fishloop_vins/data"

# pose graph 保存目录。
# 在 loop_fusion 终端按保存快捷键时会把 pose graph 写到这里。
pose_graph_save_path: "/root/catkin_ws/src/fishloop_vins/data/pose_graph/"

# 是否加载之前保存的 pose graph。
# 0 = 每次从空图开始；1 = 启动时加载 pose_graph_save_path 下的历史图。
load_previous_pose_graph: 0

# 使用原版已经提供的 SKIP_CNT 机制降低双鱼眼规范视图的计算频率。
# 1 表示隔帧建立 pose-graph keyframe，不改变 DBoW/几何/优化流程。
loop_keyframe_skip: 1

#========================
# 回环候选检索参数：DBoW 层
#========================

# FAST 角点阈值，用于在“旧关键帧图像”上重新检测 BRIEF 特征。
# 数值越小，角点越多，召回率更高但误匹配和计算量也更高。
loop_fast_threshold: 20

# DBoW 每次查询返回的候选数量上限。
# 双相机 EUCM-PnP 是这里的主要耗时；限制到前 2 名，避免回环线程长期
# 落后于 VIO，并让原始图像在完成关键帧同步前被队列淘汰。
loop_dbow_max_results: 4

# 实验性邻域重排；原版兼容模式下不启用。
loop_candidate_neighbor_window: 0
loop_candidate_neighbor_stride: 10

# DBoW 查询时跳过最近多少个 keyframe。
# 只查询 index < 当前 index - loop_min_query_gap 的旧关键帧。
# 如果回环发生得很快，可以减小；如果容易把近邻当回环，可以增大。
# loop_keyframe_skip=3 后图关键帧约 2.5 Hz；60 帧仍对应约 24 秒，保持与
# 原 skip=1/query_gap=120 基本相同的时间排除范围。
loop_min_query_gap: 60

# 最早从第几个 keyframe 开始允许检测回环。
# 用于避免刚启动、关键帧太少时产生无意义候选。
loop_min_detect_index: 50

# 是否丢弃 estimator 发布的最初若干稳定关键帧。起终点回访通常正依赖
# 这些画面，因此默认为 0；初始化不稳定帧由 estimator warmup 缓存负责隔离。
loop_skip_first_keyframes: 0

# DBoW 最佳候选最低分数。
# ret[0].Score 低于该值时，不进入几何验证。
# 降低可提高召回，但会增加误候选。
# 这组 fisheye/full-undist keyframe 的首尾相似分数约 0.022~0.027；
# 设为 0.020 才会进入后续 BRIEF/PnP 几何验证。
loop_dbow_min_neighbor_score: 0.010

# DBoW 被选中候选的最低分数。
# 候选 Score 低于该值时丢弃。
# 通常应小于等于 loop_dbow_min_neighbor_score。
loop_dbow_min_candidate_score: 0.008

# 诊断兼容通道：每隔 loop_force_first_interval 帧，把最早 N 个关键帧追加到
# 几何候选中，不依赖 DBoW 是否召回。它可验证/弥补“真起点未进入 top-K”
# 的问题；ORB+PnP 的严格内点、姿态和平移门槛仍会过滤假候选。确认 dense
# DBoW 已能稳定召回后可把 loop_force_first_keyframes 设为 0。
loop_force_first_keyframes: 0
loop_force_first_interval: 5

# 多视图检索结果必须在连续关键帧中重复落到相邻的历史关键帧簇，才进入
# 几何验证。这样可抑制单帧纹理混淆，同时允许最佳 old frame 在邻近帧间漂移。
loop_temporal_vote_frames: 3
loop_temporal_vote_min_hits: 2
loop_temporal_candidate_window: 5

#========================
# 回环几何验证参数：ORB/BRIEF + PnP 层
#========================

# BRIEF 描述子匹配的最大 Hamming 距离，范围大致 0-256。
# 数值越大匹配越宽松，raw matches 更多但外点也更多。
loop_brief_dist_threshold: 80

# 最近邻与次近邻 Hamming 距离比值。只有 best < ratio * second-best
# 才保留，随后还会执行双向互检和旧帧关键点一对一约束。
# 0.80 是较稳健的初始值；若真回环召回不足，可依据日志逐步放宽到 0.85，
# 不建议超过 0.90。
loop_brief_ratio_threshold: 0.80

# 实验性 ORB 几何路径；默认关闭，使用原版 BRIEF 匹配思路。
loop_orb_geometry: 0
# 在 OpenCV CUDA cudafeatures2d 可用时，将 ORB 双向 Hamming KNN 匹配放到 GPU；
# 无 CUDA 模块、无设备或运行异常时自动回退 CPU BFMatcher。
loop_use_gpu: 1
loop_orb_features: 2500
loop_orb_fast_threshold: 12
loop_orb_dist_threshold: 72
loop_orb_ratio_threshold: 0.90
# 普通回环几何使用当前帧精确绑定3D的 VIO ORB，匹配旧关键帧在2×5个
# 规范透视视图中均匀提取的 dense ORB。旧 dense 点只提供精确 EUCM bearing，
# 不再把当前 dense 点按像素近邻绑定到 VIO 3D。
loop_orb_exact_dense_dist_threshold: 72
loop_orb_exact_dense_ratio_threshold: 0.90
loop_orb_exact_dense_min_pnp_inliers: 12
# 强制验证的早期关键帧同样使用 exact-current→dense-canonical-old，但允许
# 使用单独的宽松描述子阈值和后续大 yaw 门限。
loop_orb_dense_dist_threshold: 50
loop_orb_dense_ratio_threshold: 0.90
# 以下两个参数仅为旧 dense↔dense 分支的配置兼容项；新的 exact→dense
# 路径不做跨规范视图的单一 homography，因为多个透视平面不存在统一单应。
loop_orb_dense_min_geometric_inliers: 40
loop_orb_dense_homography_threshold: 5.0
# 强制早期候选仍必须通过 PnP RANSAC，因此可使用独立的最终内点门槛。
loop_orb_dense_min_pnp_inliers: 10
# 第二组 bag 首尾朝向相差约 103 度；只有显式强制的早期诊断候选允许
# 大角度回环，普通 DBoW 候选仍使用下方 45 度限制。
loop_orb_dense_max_yaw_deg: 150.0
# 旧配置兼容项；exact-current→dense-old 不再使用像素近邻关联。
loop_orb_association_radius: 10.0

# 每台相机达到 5 个内点即可作为双相机约束的“贡献者”；双相机仍需总内点
# 达到上面的 12，并通过位姿一致性检查。
loop_per_camera_min_inliers: 10
# 若只有一台相机能稳定求解，则采用更强的绝对内点数和内点率门槛，避免
# 为提高召回率而直接允许任意 6~8 内点的单相机假回环。
loop_single_camera_min_inliers: 10
loop_single_camera_min_inlier_ratio: 0.40
# 鱼眼规范视图边缘的 bearing 对标定误差更敏感，允许两台相机的独立 PnP
# 结果存在小幅差异；数量级明显错误的解仍会被一致性门限拒绝。
loop_camera_consistency_rotation_deg: 20.0
loop_camera_consistency_translation: 1.5

# 描述子互检之后、PnP 之前，分别在 cam0 和 cam1 内用归一化 bearing
# 估计 Essential Matrix。只过滤同一相机跨帧不满足极线约束的对应，绝不把
# 两台相机的点混进同一个模型。少于 16 对时不执行该预过滤，直接交给 PnP
# RANSAC；五点法在 8--15 个随机匹配上几乎总能拟合出 6--9 个“内点”，既慢
# 又没有提供有效筛选。
# 像素门限同样按 canonical-view 焦距换算到归一化坐标。
loop_epipolar_min_matches: 16
loop_epipolar_reprojection_error_px: 2.0
loop_epipolar_confidence: 0.99

# PnP 不使用当前漂移 VIO 位姿作为初值，而由 EPNP RANSAC 独立求解，
# 再对内点做 iterative refinement。像素门限按 canonical-view 焦距换算，
# 不能用原始 EUCM fx，否则本配置下门限会被错误压紧约 4.6 倍。
loop_pnp_ransac_iterations: 200
loop_pnp_reprojection_error_px: 10.0
loop_pnp_confidence: 0.99

# BRIEF 兼容路径使用代码中的“LOOP_MIN_LOOP_NUM + 1”判定，因此这里设为
# 11 对应双相机总内点至少 12。仍要求每台有效相机至少 5 个 PnP 内点，并
# 保留双相机位姿一致性检查，避免仅凭宽松描述子匹配接受假回环。
loop_min_inliers: 13

# PnP 得到的相对 yaw 最大允许值，单位度。
# 超过该值即使几何匹配足够也会拒绝，防止姿态不合理的回环。
loop_max_yaw_deg: 20.0

# PnP 得到的相对平移可选安全门，单位米；小于等于 0 表示禁用。
# 双相机分别求解、总内点数、单相机内点率和双相机位姿一致性已经负责
# 几何验证，因此不再用固定距离拒绝大场景中的有效回环边。
loop_max_translation: 0.0

#========================
# 调试图像与可视化
#========================

# 是否保留并发布回环匹配调试图。
# 1 = 以 JPEG 压缩形式保留关键帧双目图，并在回环接受时发布
#     /loop_fusion/match_image；原始图和 canonical views 会及时释放。
# 0 = 不保留、不发布调试图。
save_image: 1

# IMU 前向可视化偏移，单位像素/显示用。
# 当前正常运行基本不使用，保留为 0。
visualize_imu_forward: 0

# RViz 中相机位姿标记的显示尺寸。
# 只影响可视化，不影响回环检测或优化。
visualize_camera_size: 0.4
