%YAML:1.0

#==========================================================
# Auto-generated by kalibr_to_vins.py — DO NOT EDIT BY HAND.
# Re-run the script to refresh.
#
# Camera pair selected: cam1 + cam2
# IMU topic           : /imu/data_raw
# Configured inputs   : /cam1/image / /cam2/image
# VINS subscribes to  : /cam1/image / /cam2/image
# Compressed input    : True
# Padding             : top=0 bottom=0 left=0 right=0
#                       (pad_fisheye_node.py rebuilds the symmetric fisheye)
# is_fisheye          : 1  (1 = dual-fisheye spherical mode;
#                       this fork only implements the is_fisheye:1 path —
#                       the is_fisheye:0 branch in estimator.cpp is empty
#                       and segfaults at runtime.)
#==========================================================

#common parameters
imu: 1
num_of_cam: 2

is_fisheye: 1

imu_topic: "/imu/data_raw"

# Raw image topics (used when is_compressed_images:0)
image0_topic: "/cam1/image"
image1_topic: "/cam2/image"

# Compressed image topics (used when is_compressed_images:1)
is_compressed_images: 1
compressed_image0_topic: "/cam1/image/compressed"
compressed_image1_topic: "/cam2/image/compressed"

output_path: "/root/catkin_ws/src/fishloop_vins/data"

cam0_calib: "cam1_eucm.yaml"
cam1_calib: "cam2_eucm.yaml"

# image_width/height here are the FLATTENED virtual-pinhole sub-image
# dimensions (used as WIDTH inside FisheyeUndist), NOT the input fisheye
# resolution. Recommended 300-600 for VIO. The actual padded input size
# (1920 x 1200) is declared inside cam1_*.yaml / cam2_*.yaml.
image_width: 600
image_height: 200
show_width: 1080      # SHOW_WIDTH for the show_track visualization

# Extrinsic parameter between IMU and Camera.
estimate_extrinsic: 0   # 0  trust the matrices below; 1  refine online.

body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [
            9.9977695823748136e-01,  1.8880710886196625e-02,  9.4632200567150090e-03, -4.3310128555755847e-02,
           -2.0696781103345323e-02,  7.8670177317273648e-01,  6.1698619379920727e-01,  5.1942009471196635e-02,
            4.2044059473561966e-03, -6.1704443830513911e-01,  7.8691707576295844e-01,  1.1185300658552708e-02,
            0.0000000000000000e+00,  0.0000000000000000e+00,  0.0000000000000000e+00,  1.0000000000000000e+00 ]

body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [
            9.9976796389154932e-01, -1.1184772873714771e-02,  1.8409759148474484e-02,  2.2262430790540411e-02,
           -2.8893993131936710e-03,  7.7728110925417293e-01,  6.2914682592238080e-01,  5.1736400843775662e-02,
           -2.1346422364188967e-02, -6.2905403428669071e-01,  7.7706843469535147e-01,  1.0906620287101973e-02,
            0.0000000000000000e+00,  0.0000000000000000e+00,  0.0000000000000000e+00,  1.0000000000000000e+00 ]

#Multiple thread support
multiple_thread: 1
#GPU acceleration
use_gpu: 1
use_vxworks: 0

# Dual-fisheye sub-image flags. Each fisheye camera is unwarped into
# 5 virtual pinhole sub-images (top + 4 sides). For forward-facing stereo
# the "top" sub-image (cam optical axis) is the most useful one.
fisheye_fov: 250.0
enable_up_top: 1
enable_down_top: 1
enable_up_side: 0
enable_down_side: 0
enable_rear_side: 0
thres_outlier: 5.0
tri_max_err: 3.0
pub_flatten: 0
pub_flatten_freq: 10
flatten_color: 0
enable_downsample: 0

enable_depth: 0
rgb_depth_cloud: -1
depth_estimate_baseline: 0.05
depth_config: "depth_cpu.yaml"
top_cnt: 150
side_cnt: 100

#feature tracker parameters
max_cnt: 150
max_solve_cnt: 150
min_dist: 30
freq: 10
F_threshold: 1.0
show_track: 0
flow_back: 1
enable_perf_output: 0
use_orb: 0

warn_imu_freq: 0
warn_imu_duration: 0
imu_freq: 200
image_freq: 30

#optimization parameters
max_solver_time: 0.04
max_num_iterations: 8
keyframe_parallax: 10.0

#imu parameters (kalibr-derived, scaled by --imu-noise-scale = 5.0)
acc_n: 0.089174192
gyr_n: 0.0083421967
acc_w: 0.0040356572
gyr_w: 0.0005072841
g_norm: 9.81

#unsynchronization parameters
estimate_td: 0
td: -4.4974052495221515e-03      # kalibr "timeshift_cam_imu"

#loop closure parameters
load_previous_pose_graph: 0
pose_graph_save_path: "/root/catkin_ws/src/fishloop_vins/data/pose_graph/"
save_image: 0

#rectify
publish_rectify: 0
cam0_rectify: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [ 1, 0, 0,
           0, 1, 0,
           0, 0, 1 ]
cam1_rectify: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [ 1, 0, 0,
           0, 1, 0,
           0, 0, 1 ]
